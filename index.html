<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조직진단 사전 인터뷰</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
  }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    color: #e2e8f0;
    background: #0f172a;
  }
  #fallback a { color: #60a5fa; margin-top: 12px; }
</style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwXKsSAps4u833yNvVu5jwQxpC0WklNLXrl3V4No-VU31mxM6RCI8dF59eWsY7y0UdE7A/exec"
    title="조직진단 사전 인터뷰"
    allow="clipboard-write"
  ></iframe>
  <div id="fallback">
    <p>화면이 보이지 않으면 아래 주소로 직접 접속해주세요.</p>
    <a href="https://script.google.com/macros/s/AKfycbwXKsSAps4u833yNvVu5jwQxpC0WklNLXrl3V4No-VU31mxM6RCI8dF59eWsY7y0UdE7A/exec" target="_top">직접 접속하기</a>
  </div>
  <script>
    // 일부 환경에서 구글 로그인 차단 등으로 프레임 로딩이 실패하면 안내문구 노출
    setTimeout(function () {
      try {
        var frame = document.getElementById('appFrame');
        if (!frame.contentWindow) {
          document.getElementById('fallback').style.display = 'flex';
        }
      } catch (e) {
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 6000);
  </script>
</body>
</html>
